<div class="ms" [class.ms-open]="open()">
  <button
    type="button"
    class="ms-trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    @if (selected(); as item) {
      <span class="ms-icon" aria-hidden="true">{{ item.icon }}</span>
      <span class="ms-label">{{ item.label }}</span>
    } @else {
      <span class="ms-placeholder">{{ placeholder() }}</span>
    }
    <span class="ms-chevron" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </span>
  </button>

  @if (open()) {
    <ul class="ms-menu" role="listbox" [attr.aria-label]="ariaLabel()">
      @for (option of options(); track option.id) {
        <li role="option" [attr.aria-selected]="value() === option.id">
          <button
            type="button"
            class="ms-option"
            [class.ms-option-active]="value() === option.id"
            [class.tone-positive]="option.tone === 'positive'"
            [class.tone-neutral]="option.tone === 'neutral'"
            [class.tone-negative]="option.tone === 'negative'"
            (click)="choose(option.id)"
          >
            <span class="ms-option-icon" aria-hidden="true">{{ option.icon }}</span>
            <span class="ms-option-label">{{ option.label }}</span>
            @if (value() === option.id) {
              <span class="ms-check" aria-hidden="true">✓</span>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
