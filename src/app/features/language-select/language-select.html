<section class="relative flex min-h-dvh items-center justify-center overflow-hidden px-4 py-12">
  <div class="orb h-72 w-72 bg-orange-500/40 -top-16 start-1/4 animate-float"></div>
  <div
    class="orb h-80 w-80 bg-teal-400/40 bottom-0 end-1/5 animate-float [animation-delay:-3s]"
  ></div>
  <div class="orb h-48 w-48 bg-cream-400/80 top-1/3 end-1/4 animate-float [animation-delay:-5s]"></div>

  <div class="glass-panel animate-rise relative z-10 w-full max-w-lg p-8 text-center sm:p-10">
    <div class="logo-mark mx-auto">
      <img
        src="assets/logo.png"
        alt="Bubble Hope"
        width="512"
        height="315"
        fetchpriority="high"
      />
    </div>

    <p class="eyebrow mt-5">{{ isExpo() ? 'Bubble Hope Expo' : 'Bubble Hope' }}</p>
    <h1 class="mt-2 text-2xl font-bold text-ink-900 sm:text-3xl">{{ i18n.t('lang.title') }}</h1>
    <p class="mt-2 text-sm text-ink-500">{{ i18n.t('lang.subtitle') }}</p>

    <div class="mt-8 grid gap-3 sm:grid-cols-2">
      <button
        type="button"
        class="lang-card"
        [class.is-active]="selected() === 'ar'"
        (click)="pick('ar')"
      >
        <span class="lang-name">العربية</span>
        <span class="lang-hint">Arabic</span>
      </button>

      <button
        type="button"
        class="lang-card"
        [class.is-active]="selected() === 'en'"
        (click)="pick('en')"
      >
        <span class="lang-name">English</span>
        <span class="lang-hint">الإنجليزية</span>
      </button>
    </div>

    <button type="button" class="btn-primary mt-8 w-full text-base" (click)="continue()">
      <span>{{ i18n.t('lang.continue') }}</span>
      <span aria-hidden="true">{{ selected() === 'ar' ? '←' : '→' }}</span>
    </button>
  </div>
</section>
